<style>
/* Apple Liquid Glass Design System */
/* Based on Apple's design guidelines and liquid glass materials */

:root {
  /* Apple Color Scheme - Light Mode */
  --color-primary: #007AFF;
  --color-secondary: #5856D6;
  --color-success: #34C759;
  --color-warning: #FF9500;
  --color-danger: #FF3B30;
  
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F2F2F7;
  --color-bg-tertiary: #E5E5EA;
  
  --color-text-primary: #000000;
  --color-text-secondary: #3C3C43;
  --color-text-tertiary: #8E8E93;
  
  --color-separator: rgba(60, 60, 67, 0.29);
  
  /* Gradient colors */
  --gradient-start: #667eea;
  --gradient-end: #764ba2;
  
  /* Glass effect */
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.3);
  --glass-shadow: rgba(0, 0, 0, 0.1);
  
  /* Typography */
  --font-primary: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --font-size-3xl: 48px;
  
  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  
  /* Border Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  
  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0.0, 0.2, 1);
  --transition-base: 250ms cubic-bezier(0.4, 0.0, 0.2, 1);
  --transition-slow: 350ms cubic-bezier(0.4, 0.0, 0.2, 1);
}

/* Dark Mode Colors */
.dark-mode {
  --color-primary: #0A84FF;
  --color-secondary: #5E5CE6;
  --color-success: #30D158;
  --color-warning: #FF9F0A;
  --color-danger: #FF453A;
  
  --color-bg-primary: #000000;
  --color-bg-secondary: #1C1C1E;
  --color-bg-tertiary: #2C2C2E;
  
  --color-text-primary: #FFFFFF;
  --color-text-secondary: #EBEBF5;
  --color-text-tertiary: #AEAEB2;
  
  --color-separator: rgba(235, 235, 245, 0.29);
  
  --glass-bg: rgba(28, 28, 30, 0.7);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-shadow: rgba(0, 0, 0, 0.5);
}

/* Reset & Base Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-primary);
  font-size: var(--font-size-base);
  color: var(--color-text-primary);
  background-color: var(--color-bg-primary);
  overflow-x: hidden;
  transition: background-color var(--transition-base), color var(--transition-base);
}

/* Hide scrollbar but keep functionality */
::-webkit-scrollbar {
  width: 0px;
  height: 0px;
}

body {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

/* Gradient Background */
.gradient-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
  opacity: 0.1;
  animation: gradientShift 10s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Glass Card Effect */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 32px 0 var(--glass-shadow);
  transition: all var(--transition-base);
}

.glass-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px 0 var(--glass-shadow);
}

.glass-button {
  background: var(--glass-bg);
  backdrop-filter: blur(10px) saturate(180%);
  -webkit-backdrop-filter: blur(10px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
}

.glass-button:hover {
  background: rgba(var(--glass-bg), 0.9);
  transform: scale(1.02);
}

.glass-button:active {
  transform: scale(0.98);
}

/* Login Container */
.login-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: var(--spacing-lg);
  position: relative;
}

.login-card {
  max-width: 450px;
  width: 100%;
  padding: var(--spacing-2xl);
  text-align: center;
  animation: fadeIn 0.5s ease-out;
  position: relative;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Logo */
.logo-container {
  margin-bottom: var(--spacing-lg);
}

.company-logo {
  width: 80px;
  height: 80px;
  animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.company-name {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  margin-bottom: var(--spacing-xs);
  background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.app-name {
  font-size: var(--font-size-lg);
  font-weight: 500;
  color: var(--color-text-secondary);
  margin-bottom: var(--spacing-xl);
}

/* OTP Input */
.otp-input-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-lg);
}

.otp-input {
  width: 50px;
  height: 60px;
  text-align: center;
  font-size: var(--font-size-xl);
  font-weight: 600;
  border: 2px solid var(--glass-border);
  border-radius: var(--radius-md);
  background: var(--glass-bg);
  color: var(--color-text-primary);
  transition: all var(--transition-fast);
}

.otp-input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
  transform: scale(1.05);
}

.otp-separator {
  font-size: var(--font-size-xl);
  font-weight: 600;
  color: var(--color-text-tertiary);
}

/* Buttons */
.btn-primary {
  width: 100%;
  padding: var(--spacing-md) var(--spacing-lg);
  font-size: var(--font-size-base);
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
  border: none;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all var(--transition-fast);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* OTP Progress */
.otp-progress-container {
  margin-top: var(--spacing-lg);
}

.otp-progress-bar {
  width: 100%;
  height: 6px;
  background: var(--color-bg-tertiary);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-bottom: var(--spacing-sm);
}

.otp-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
  border-radius: var(--radius-full);
  transition: width var(--transition-base);
}

.otp-timer {
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
}

.login-help-text {
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
  margin-top: var(--spacing-md);
}

/* Theme Toggle */
.theme-toggle-btn {
  position: absolute;
  top: var(--spacing-lg);
  right: var(--spacing-lg);
  width: 44px;
  height: 44px;
  padding: var(--spacing-sm);
  background: var(--glass-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-toggle-btn:hover {
  transform: scale(1.1) rotate(15deg);
}

.theme-toggle-btn:active {
  transform: scale(0.95) rotate(0deg);
}

.theme-icon {
  width: 24px;
  height: 24px;
  color: var(--color-text-primary);
}

/* App Container */
.app-container {
  min-height: 100vh;
  padding: var(--spacing-lg);
  animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Header */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--spacing-md) var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
  position: sticky;
  top: var(--spacing-lg);
  z-index: 100;
}

.logo-button {
  cursor: pointer;
  transition: all var(--transition-fast);
  padding: var(--spacing-sm);
  border-radius: var(--radius-md);
}

.logo-button:hover {
  transform: scale(1.1);
}

.logo-button:active {
  transform: scale(0.9) rotate(5deg);
  animation: logoPress 0.3s ease;
}

@keyframes logoPress {
  0%, 100% { transform: scale(0.9) rotate(0deg); }
  50% { transform: scale(0.85) rotate(5deg); }
}

.header-logo {
  width: 40px;
  height: 40px;
}

/* Header Controls */
.header-controls {
  display: flex;
  gap: var(--spacing-md);
  align-items: center;
}

.view-toggle-container {
  display: flex;
  gap: var(--spacing-sm);
}

.view-toggle {
  display: flex;
  padding: var(--spacing-xs);
  gap: var(--spacing-xs);
}

.view-toggle-btn {
  padding: var(--spacing-sm) var(--spacing-md);
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-text-secondary);
  background: transparent;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.view-toggle-btn:hover {
  color: var(--color-text-primary);
  background: rgba(255, 255, 255, 0.1);
}

.view-toggle-btn.active {
  color: white;
  background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
  box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
}

.icon-btn {
  width: 44px;
  height: 44px;
  padding: var(--spacing-sm);
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.icon-btn:hover {
  transform: scale(1.1);
}

.icon-btn:active {
  transform: scale(0.95);
}

.icon {
  width: 24px;
  height: 24px;
  color: var(--color-text-primary);
}

/* View Content */
.view-content {
  display: none;
  animation: fadeIn 0.3s ease-out;
}

.view-content.active {
  display: block;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.stat-card {
  padding: var(--spacing-lg);
  text-align: center;
  transition: all var(--transition-base);
}

.stat-card.clickable {
  cursor: pointer;
}

.stat-card.clickable:hover {
  transform: translateY(-4px) scale(1.02);
}

.stat-card.clickable:active {
  transform: translateY(0) scale(0.98);
}

.stat-card:not(.clickable):hover {
  transform: none;
}

.stat-icon {
  font-size: var(--font-size-3xl);
  margin-bottom: var(--spacing-sm);
}

.stat-label {
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
  margin-bottom: var(--spacing-xs);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-value {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  color: var(--color-text-primary);
}

/* Tickers */
.tickers-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.ticker-section {
  margin-bottom: var(--spacing-md);
}

.ticker-title {
  font-size: var(--font-size-lg);
  font-weight: 600;
  margin-bottom: var(--spacing-md);
  color: var(--color-text-primary);
}

.ticker {
  padding: var(--spacing-md);
  overflow: hidden;
  position: relative;
  background: transparent;
  border: 1px solid var(--glass-border);
}

.ticker-content {
  display: flex;
  gap: var(--spacing-xl);
  animation: tickerScroll 30s linear infinite;
}

.ticker-content:hover {
  animation-play-state: paused;
}

@keyframes tickerScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-md);
  border-radius: var(--radius-md);
  white-space: nowrap;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  transition: all var(--transition-fast);
}

.ticker-item.size-1 { font-size: var(--font-size-xl); font-weight: 700; }
.ticker-item.size-2 { font-size: var(--font-size-lg); font-weight: 600; }
.ticker-item.size-3 { font-size: var(--font-size-base); font-weight: 500; }
.ticker-item.size-4 { font-size: var(--font-size-sm); font-weight: 500; }
.ticker-item.size-5 { font-size: var(--font-size-sm); font-weight: 400; }
.ticker-item.size-6 { font-size: var(--font-size-xs); font-weight: 400; }
.ticker-item.size-7 { font-size: var(--font-size-xs); font-weight: 400; }

.ticker-item.bullish {
  border-left: 3px solid var(--color-success);
}

.ticker-item.bearish {
  border-left: 3px solid var(--color-danger);
}

/* Synced Signals Section */
.synced-signals-section {
  margin-top: var(--spacing-xl);
}

.section-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  margin-bottom: var(--spacing-lg);
  color: var(--color-text-primary);
}

/* Signals Grid */
.signals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--spacing-lg);
}

.signal-card {
  padding: var(--spacing-lg);
  cursor: pointer;
  position: relative;
  transition: all var(--transition-base);
}

.signal-card:hover {
  transform: translateY(-4px) scale(1.02);
}

.signal-card:active {
  transform: translateY(0) scale(0.98);
}

.signal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-md);
}

.signal-symbol {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--color-text-primary);
}

.signal-status {
  padding: var(--spacing-xs) var(--spacing-sm);
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.signal-status.synced {
  background: rgba(52, 199, 89, 0.2);
  color: var(--color-success);
}

.signal-status.awaiting {
  background: rgba(255, 149, 0, 0.2);
  color: var(--color-warning);
}

.signal-status.unsynced {
  background: rgba(255, 59, 48, 0.2);
  color: var(--color-danger);
}

.signal-time {
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
  margin-bottom: var(--spacing-sm);
}

.signal-reason {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-xs) var(--spacing-sm);
  background: rgba(255, 255, 255, 0.05);
  border-radius: var(--radius-sm);
  margin-bottom: var(--spacing-xs);
}

.reason-label {
  font-weight: 600;
  color: var(--color-text-tertiary);
}

/* View Header */
.view-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-xl);
}

.view-title {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  color: var(--color-text-primary);
}

/* Sort Controls */
.sort-controls {
  display: flex;
  gap: var(--spacing-md);
  align-items: center;
}

.sort-toggle {
  display: flex;
  padding: var(--spacing-xs);
  gap: var(--spacing-xs);
}

.sort-btn {
  padding: var(--spacing-sm) var(--spacing-md);
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-text-secondary);
  background: transparent;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.sort-btn:hover {
  color: var(--color-text-primary);
  background: rgba(255, 255, 255, 0.1);
}

.sort-btn.active {
  color: white;
  background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
}

/* Logs Layout */
.logs-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--spacing-lg);
  height: calc(100vh - 250px);
}

.logs-section {
  padding: var(--spacing-lg);
  border-radius: var(--radius-lg);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  overflow-y: auto;
}

.logs-hvd {
  grid-row: 1 / 3;
}

.logs-quadrants {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: repeat(4, 1fr);
  gap: var(--spacing-lg);
}

.logs-section-title {
  font-size: var(--font-size-lg);
  font-weight: 600;
  margin-bottom: var(--spacing-md);
  color: var(--color-text-primary);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.logs-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--spacing-md);
}

/* Historical View */
.dates-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--spacing-lg);
}

.date-card {
  padding: var(--spacing-lg);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition-base);
}

.date-card:hover {
  transform: translateY(-4px) scale(1.02);
}

.date-card:active {
  transform: translateY(0) scale(0.98);
}

.date-value {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--color-text-primary);
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-backdrop {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: fadeIn 0.2s ease-out;
}

.modal-content {
  position: relative;
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: var(--spacing-xl);
  animation: modalSlideIn 0.3s ease-out;
  z-index: 1001;
}

@keyframes modalSlideIn {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-close {
  position: absolute;
  top: var(--spacing-md);
  right: var(--spacing-md);
  width: 36px;
  height: 36px;
  background: var(--color-bg-tertiary);
  border: none;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xl);
  font-weight: 300;
  color: var(--color-text-primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.modal-close:hover {
  background: var(--color-danger);
  color: white;
  transform: rotate(90deg);
}

.modal-title {
  font-size: var(--font-size-2xl);
  font-weight: 700;
  margin-bottom: var(--spacing-lg);
  color: var(--color-text-primary);
}

.modal-detail-row {
  display: flex;
  justify-content: space-between;
  padding: var(--spacing-md);
  margin-bottom: var(--spacing-sm);
  background: rgba(255, 255, 255, 0.05);
  border-radius: var(--radius-md);
}

.modal-detail-label {
  font-weight: 600;
  color: var(--color-text-tertiary);
}

.modal-detail-value {
  color: var(--color-text-primary);
  text-align: right;
}

/* Responsive Design */
@media (max-width: 768px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }
  
  .logs-layout {
    grid-template-columns: 1fr;
    height: auto;
  }
  
  .logs-hvd {
    grid-row: auto;
